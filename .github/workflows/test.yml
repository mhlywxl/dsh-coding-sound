name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: client bundle syntax
        run: node --check client.js
      - name: client.js is current
        run: node scripts/build-client.mjs --check
      - name: Offline test bench
        run: node test.mjs
      - name: npm package contents
        run: npm pack --dry-run
