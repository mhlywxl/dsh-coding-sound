name: oidc-check

# Temporary diagnostic for npm Trusted Publishing. Delete after use.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: exchange GitHub OIDC token for an npm token
        run: |
          set -euo pipefail
          echo "npm $(npm --version), node $(node --version)"
          echo "id-token url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          id_resp="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          id_token="$(printf '%s' "$id_resp" | jq -r '.value // empty')"
          echo "github id token length: ${#id_token}"
          if [ -z "$id_token" ]; then
            echo "no GitHub id token; response follows"
            printf '%s\n' "$id_resp"
            exit 0
          fi
          code="$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            -H "Accept: application/json" \
            'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-coding-sound')"
          echo "exchange HTTP status: ${code}"
          jq -r 'if .token then "exchange succeeded: npm token received (hidden)" else (.message // .error // "no message") end' /tmp/exchange.json
